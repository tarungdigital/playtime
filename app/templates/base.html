<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">

<title>{% block title %}{{ shop_name }}{% endblock %}</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --surface: #151a23;
    --surface-2: #1c2230;
    --line: #262e3e;
    --text: #f3f5f9;
    --muted: #8d96aa;
    --accent: #ff3d52;
    --accent-soft: rgba(255, 61, 82, .14);
    --ok: #2ee6a6;
    --ok-soft: rgba(46, 230, 166, .12);
    --warn: #ffb224;
    --warn-soft: rgba(255, 178, 36, .13);
    --danger: #ff4d5e;
    --danger-soft: rgba(255, 77, 94, .13);
    --info-soft: rgba(120, 160, 255, .12);
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(255, 61, 82, .18), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 440px; margin: 0 auto; padding: 18px 16px 40px; }
  .wrap.wide { max-width: 1120px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .2px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 10px; background: var(--accent);
    display: grid; place-items: center; box-shadow: 0 6px 20px rgba(255, 61, 82, .35);
  }
  .badge {
    font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap;
  }
  .badge.free { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .badge.busy { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .muted { color: var(--muted); }
  a { color: inherit; }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block body %}
<div class="wrap {% block wrap_class %}{% endblock %}">
  <header class="top">
    {% include "_brand.html" %}
    {% block badge %}{% endblock %}
  </header>
  {% block content %}{% endblock %}
</div>
{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
